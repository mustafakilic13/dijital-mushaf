# Her push (main) ve her çekme isteğinde bütün testleri çalıştırır.
# Yerelde aynısı:  cd test && npm ci && npm test
name: Testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testler-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Testler (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/package-lock.json
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Testleri çalıştır
        run: npm test
